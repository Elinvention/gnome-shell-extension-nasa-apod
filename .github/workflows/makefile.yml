name: Makefile CI

on:
  push:
    tags: [ '*' ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      run: |
        git clone --branch "${GITHUB_REF#refs/tags/}" "https://github.com/${{ github.repository }}.git" .

    - name: Install npm dependencies
      run: npm install

    - name: Check code with eslint
      run: |
        export PATH="$PATH:$GITHUB_WORKSPACE/node_modules/.bin"
        make eslint

    - name: APT update
      run: sudo apt-get update

    - name: Install intltool, gettext and zip
      run: sudo apt-get install -y intltool gettext zip

    - name: Install libglib2.0-dev
      run: sudo apt-get install -y libglib2.0-dev

    - name: Generate extension zip
      run: make zip

    - name: Generate extension pot
      run: make potfile

    - name: Create or update release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="${GITHUB_REF#refs/tags/}"
        RELEASE_TITLE="Version ${TAG_NAME#v}"
        
        TAG_SHA="$(gh api "repos/${{ github.repository }}/git/ref/tags/${TAG_NAME}" --jq '.object.sha')"
        gh api "repos/${{ github.repository }}/git/tags/${TAG_SHA}" --jq '.message' | sed -e '1{/^Version [v0-9]/d}' -e '1{/^$/d}' > releaseBody.md

        if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
          gh release edit "${TAG_NAME}" --title "${RELEASE_TITLE}" --notes-file releaseBody.md
          gh release upload "${TAG_NAME}" nasa_apod.zip po/nasa-apod.pot --clobber
        else
          gh release create "${TAG_NAME}" nasa_apod.zip po/nasa-apod.pot \
            --title "${RELEASE_TITLE}" \
            --notes-file releaseBody.md
        fi
