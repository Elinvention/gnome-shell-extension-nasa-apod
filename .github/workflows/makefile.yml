name: Makefile CI

on:
  push:
    tags: [ '*' ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24
    
    - name: Install npm dependencies
      run: npm install

    - name: Check code with eslint
      run: |
        export PATH="$PATH:$GITHUB_WORKSPACE/node_modules/.bin"
        make eslint

    - name: APT update
      run: sudo apt-get update

    - name: Install intltool and gettext
      run: sudo apt-get install -y intltool gettext

    - name: Install libglib2.0-dev
      run: sudo apt-get install -y libglib2.0-dev

    - name: Install gnome-shell
      run: sudo apt-get install -y gnome-shell --no-install-recommends

    - name: Generate extension zip
      run: make build

    - name: Generate extension pot
      run: make potfile

    - name: Create or update release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="${GITHUB_REF#refs/tags/}"
        RELEASE_TITLE="Version ${TAG_NAME}"
        git tag -l --format='%(contents:body)' "${TAG_NAME}" | sed -E 's/^( {1,4}|\t)//' > releaseBody.md

        if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
          gh release edit "${TAG_NAME}" --title "${RELEASE_TITLE}" --notes-file releaseBody.md
          gh release upload "${TAG_NAME}" nasa_apod@elinvention.ovh.zip nasa_apod@elinvention.ovh.pot --clobber
        else
          gh release create "${TAG_NAME}" nasa_apod@elinvention.ovh.zip nasa_apod@elinvention.ovh.pot \
            --title "${RELEASE_TITLE}" \
            --notes-file releaseBody.md
        fi
